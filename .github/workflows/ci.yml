name: CI

on:
  push:
  pull_request:

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        working-directory: ./backend
        run: dotnet restore PayLink.sln

      - name: Build
        working-directory: ./backend
        run: dotnet build PayLink.sln --no-restore

      - name: Lint / format check
        working-directory: ./backend
        run: dotnet format PayLink.sln --verify-no-changes --no-restore

      - name: Run tests
        working-directory: ./backend
        run: dotnet test PayLink.sln --no-build --verbosity normal --collect:"XPlat Code Coverage"
