services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: paylink
      MYSQL_USER: paylinkuser
      MYSQL_PASSWORD: paylinkpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  api:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=db;Port=3306;Database=paylink;User=paylinkuser;Password=paylinkpassword;"
    depends_on:
      - db

volumes:
  mysql_data: